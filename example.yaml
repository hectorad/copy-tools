# The app (a distroless image with no shell or tools) mounts the copy-tools image
# read-only at /opt/tools and runs the binaries in place.
#
# Needs image volumes: on by default from Kubernetes 1.35 (1.33 and 1.34 need the
# ImageVolume feature gate), and a container runtime that supports them. containerd
# does; the Docker runtime does not.
apiVersion: v1
kind: Pod
metadata:
  name: tools-demo
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: gcr.io/distroless/static-debian13:nonroot
      command: ["/opt/tools/busybox", "sh", "-c", "/opt/tools/busybox ls -l /opt/tools && exec /opt/tools/busybox sleep 3600"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: tools
          mountPath: /opt/tools
  volumes:
    - name: tools
      image:
        reference: copy-tools:dev
        pullPolicy: IfNotPresent
